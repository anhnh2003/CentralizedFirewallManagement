{% extends "layouts/base.html" %}
{% block content %}
<style>
  .page-content { margin-left:0px; padding:2rem; }
  .form-row { display:flex; gap:1rem; margin-bottom:0.75rem; flex-wrap:wrap; }
  .form-row > * { flex:1; min-width:120px; }
  .rule-header { width:100%; display:flex; justify-content:space-between; align-items:center; }
  .manual-rule { display:none; margin-top:1rem; }
</style>

<div class="page-content">
  <h2 class="mb-4">Add New Rules</h2>
  <form id="rulesForm" method="POST" action="{{ url_for('home_blueprint.add_rule') }}">
    <!-- 1) Chọn nodes -->
    <div class="form-group">
      <label>Select node(s):</label>
      <div>
        {% for node in nodes %}
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox"
                 name="node_ids" id="nodecb_{{ node.id }}"
                 value="{{ node.id }}">
          <label class="form-check-label" for="nodecb_{{ node.id }}">{{ node.hostname }}</label>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- 2) Các rule bình thường -->
    <div id="rulesContainer"></div>
    <button type="button" class="btn btn-secondary" id="addRuleButton">Add Rule</button>
    <button type="button" class="btn btn-info" id="manualRuleButton">Manual Rule</button>

    <!-- 3) Manual rule -->
    <div class="manual-rule" id="manualRuleContainer">
      <textarea class="form-control" name="manual_rule"
                placeholder="sudo iptables -A INPUT -j DROP …"></textarea>
    </div>

    <button type="submit" class="btn btn-primary mt-3" id="submitButton" disabled>Submit</button>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded',() => {
  let ruleCount = 0;
  const rulesContainer = document.getElementById('rulesContainer');
  const manualContainer = document.getElementById('manualRuleContainer');
  const manualTA = manualContainer.querySelector('textarea');
  const submitBtn = document.getElementById('submitButton');

  function toggleSubmit() {
    const hasRule = rulesContainer.querySelectorAll('.form-row').length>0;
    const hasManual = manualTA.value.trim().length>0;
    const hasNode  = document.querySelectorAll('input[name="node_ids"]:checked').length>0;
    submitBtn.disabled = !(hasNode && (hasRule||hasManual));
  }

  document.getElementById('addRuleButton').onclick = ()=>{
    const row = document.createElement('div');
    row.className='form-row';
    row.innerHTML = `
      <div class="rule-header">
        <strong>Rule ${++ruleCount}</strong>
        <button type="button" class="btn btn-sm btn-danger" onclick="this.closest('.form-row').remove(); toggleSubmit();">Delete</button>
      </div>
      <select class="form-control" name="chain[]" required>
        <option>INPUT</option><option>OUTPUT</option><option>FORWARD</option>
      </select>
      <select class="form-control" name="target[]" required>
        <option>DROP</option><option>ACCEPT</option><option>REJECT</option><option>LOG</option><option>RETURN</option>
      </select>
      <input class="form-control" name="prot[]" placeholder="Protocol" required>
      <input class="form-control" name="source[]" placeholder="Source" required>
      <input class="form-control" name="destination[]" placeholder="Destination" required>
      <input class="form-control" name="sport[]" placeholder="Src Port">
      <input class="form-control" name="dport[]" placeholder="Dst Port">
    `;
    rulesContainer.append(row);
    row.querySelectorAll('input,select').forEach(el => el.oninput=toggleSubmit);
    toggleSubmit();
  };

  document.getElementById('manualRuleButton').onclick = ()=>{
    manualContainer.style.display = manualContainer.style.display==='block'?'none':'block';
    toggleSubmit();
  };
  manualTA.oninput = toggleSubmit;
  document.querySelectorAll('input[name="node_ids"]').forEach(cb => cb.onchange=toggleSubmit);

});
</script>
{% endblock %}
