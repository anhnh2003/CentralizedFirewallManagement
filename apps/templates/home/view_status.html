{% block scripts %}
<script>
    // Đảm bảo script được chạy sau khi DOM đã tải hoàn chỉnh
    document.addEventListener('DOMContentLoaded', function() {
        const nodeCheckboxes = document.querySelectorAll('.node-checkbox');
        const showSelectedNodesBtn = document.getElementById('showSelectedNodes');
        const showAllNodesBtn = document.getElementById('showAllNodes');
        const hideAllNodesBtn = document.getElementById('hideAllNodes');
        const nodeRuleContainer = document.getElementById('nodeRuleContainer');

        // Hàm ẩn tất cả các section node
        function hideAllNodeSections() {
            nodeRuleContainer.querySelectorAll('.node-table').forEach(section => {
                section.classList.add('hidden');
            });
        }

        // Hàm hiển thị một section node cụ thể
        function showNodeSection(nodeId) {
            const section = document.getElementById(`node-${nodeId}-section`);
            if (section) {
                section.classList.remove('hidden');
            }
        }

        // --- Khởi tạo ban đầu: Ẩn tất cả các node khi trang tải ---
        hideAllNodeSections();

        // --- Gắn sự kiện cho nút "Hiển thị luật của Nodes đã chọn" ---
        // Kiểm tra xem nút có tồn tại không trước khi gắn sự kiện
        if (showSelectedNodesBtn) {
            showSelectedNodesBtn.addEventListener('click', function() {
                hideAllNodeSections(); // Ẩn tất cả trước
                nodeCheckboxes.forEach(checkbox => {
                    if (checkbox.checked) {
                        showNodeSection(checkbox.value);
                    }
                });
            });
        } else {
            console.error("Element with ID 'showSelectedNodes' not found.");
        }


        // --- Gắn sự kiện cho nút "Hiển thị tất cả Nodes" ---
        if (showAllNodesBtn) {
            showAllNodesBtn.addEventListener('click', function() {
                nodeCheckboxes.forEach(checkbox => {
                    showNodeSection(checkbox.value);
                    checkbox.checked = true; // Tự động tick vào tất cả các checkbox
                });
            });
        } else {
            console.error("Element with ID 'showAllNodes' not found.");
        }


        // --- Gắn sự kiện cho nút "Ẩn tất cả Nodes" ---
        if (hideAllNodesBtn) {
            hideAllNodesBtn.addEventListener('click', function() {
                hideAllNodeSections();
                nodeCheckboxes.forEach(checkbox => {
                    checkbox.checked = false; // Bỏ tick tất cả các checkbox
                });
            });
        } else {
            console.error("Element with ID 'hideAllNodes' not found.");
        }


        // --- Tùy chọn: Khi click vào tiêu đề node, ẩn/hiện nội dung của node đó ---
        nodeRuleContainer.querySelectorAll('.node-header').forEach(header => {
            header.addEventListener('click', function() {
                const nodeContent = this.nextElementSibling; // Lấy div .node-content
                if (nodeContent) {
                    nodeContent.classList.toggle('hidden');
                }
            });
        });
    });
</script>
{% endblock scripts %}
